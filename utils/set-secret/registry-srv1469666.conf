# set-secret registry for 800802. Names/paths only — NEVER values.
# name | file | KEY (- = whole file) | restart | verify (echo HTTP code; value in $SECRET)
cloudflare        | ~/.cloudflare/token | - | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bearer $SECRET" https://api.cloudflare.com/client/v4/user/tokens/verify
hostinger         | ~/.hostinger/token | - | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bearer $SECRET" https://developers.hostinger.com/api/vps/v1/virtual-machines
ad-discord        | ~/projects/agent-dispatcher/.env | AC_DISCORD_TOKEN | sudo systemctl restart agent-dispatcher && docker restart agent-dispatcher-web | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bot $SECRET" https://discord.com/api/v10/users/@me
ad-gemini         | ~/projects/agent-dispatcher/.env | GEMINI_API_KEY | sudo systemctl restart agent-dispatcher && docker restart agent-dispatcher-web | curl -s -o /dev/null -w %{http_code} "https://generativelanguage.googleapis.com/v1beta/models?key=$SECRET"
rmx-wp-app-pw     | ~/projects/referral-maxxing/.env | WP_APP_PASSWORD | |
rmx-bing          | ~/projects/referral-maxxing/.env | BING_API_KEY | |
rmx-openai        | ~/projects/referral-maxxing/.env | OPENAI_API_KEY | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bearer $SECRET" https://api.openai.com/v1/models
rmx-anthropic     | ~/projects/referral-maxxing/.env | ANTHROPIC_API_KEY | | curl -s -o /dev/null -w %{http_code} -H "x-api-key: $SECRET" -H "anthropic-version: 2023-06-01" https://api.anthropic.com/v1/models
rmx-gemini        | ~/projects/referral-maxxing/.env | GEMINI_API_KEY | | curl -s -o /dev/null -w %{http_code} "https://generativelanguage.googleapis.com/v1beta/models?key=$SECRET"
rmx-pretty-links  | ~/projects/referral-maxxing/.env | PRETTY_LINKS_API_KEY | |
rmx-discord-hook  | ~/projects/referral-maxxing/.env | DISCORD_WEBHOOK_URL | | curl -s -o /dev/null -w %{http_code} "$SECRET"
admin-webhook     | ~/.config/sysadmin-review/webhook.env | ADMIN_WEBHOOK_URL | | curl -s -o /dev/null -w %{http_code} "$SECRET"
claude-email-pw   | ~/.config/claude-email/credentials.env | CLAUDE_EMAIL_APP_PASSWORD | |
tailscale-oauth   | ~/.config/tailscale-monitor/credentials.env | TS_OAUTH_CLIENT_SECRET | |
claude-judge      | ~/.config/claude-judge.env | JUDGE_TOKEN | sudo systemctl restart claude-judge |
book-queue-secret | ~/projects/book-request-queue/.env | QUEUE_SECRET | sudo systemctl restart book-request-queue |
grocery-queue-secret | ~/projects/grocery-request-queue/.env | QUEUE_SECRET | sudo systemctl restart grocery-request-queue |
nextdns           | ~/.config/nextdns/api-key | - | | curl -s -o /dev/null -w %{http_code} -H "X-Api-Key: $SECRET" https://api.nextdns.io/profiles
b2-800805-key-id  | ~/.config/b2/800805.env | B2_ACCOUNT_ID | |
b2-800805-key     | ~/.config/b2/800805.env | B2_ACCOUNT_KEY | | curl -s -o /dev/null -w %{http_code} -u "$(sed -n 's/^B2_ACCOUNT_ID=//p' ~/.config/b2/800805.env):$SECRET" https://api.backblazeb2.com/b2api/v3/b2_authorize_account
b2-800804-key-id  | ~/.config/b2/800804.env | B2_ACCOUNT_ID | |
b2-800804-key     | ~/.config/b2/800804.env | B2_ACCOUNT_KEY | | curl -s -o /dev/null -w %{http_code} -u "$(sed -n 's/^B2_ACCOUNT_ID=//p' ~/.config/b2/800804.env):$SECRET" https://api.backblazeb2.com/b2api/v3/b2_authorize_account
rclone-gdrive-client-id     | ~/.config/rclone/gdrive-oauth.env | RCLONE_GDRIVE_CLIENT_ID | ~/.local/bin/rclone-gdrive-apply |
rclone-gdrive-client-secret | ~/.config/rclone/gdrive-oauth.env | RCLONE_GDRIVE_CLIENT_SECRET | ~/.local/bin/rclone-gdrive-apply | r=$(curl -s -d "code=x&redirect_uri=http://127.0.0.1:53682/&grant_type=authorization_code" --data-urlencode "client_id=$(sed -n 's/^RCLONE_GDRIVE_CLIENT_ID=//p' ~/.config/rclone/gdrive-oauth.env)" --data-urlencode "client_secret=$SECRET" https://oauth2.googleapis.com/token); [[ $r == *invalid_grant* ]] && echo 200 || echo 401
