# set-secret registry for 800801. Names/paths only — NEVER values.
# name | file | KEY (- = whole file) | restart | verify (echo HTTP code; value in $SECRET)
# *arr/Plex/Tautulli keys are minted by the apps themselves — change them in the app UI, then set here.
deepgram          | ~/Desktop/media-server/.env | DEEPGRAM_API_KEY | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Token $SECRET" https://api.deepgram.com/v1/projects
deepgram-subs     | ~/Desktop/media-server/deepgram-subtitles/.env | DEEPGRAM_API_KEY | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Token $SECRET" https://api.deepgram.com/v1/projects
deepgram-abook    | ~/Desktop/epub-to-audiobook/.env | DEEPGRAM_API_KEY | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Token $SECRET" https://api.deepgram.com/v1/projects
anthropic         | ~/Desktop/media-server/.env | ANTHROPIC_API_KEY | | curl -s -o /dev/null -w %{http_code} -H "x-api-key: $SECRET" -H "anthropic-version: 2023-06-01" https://api.anthropic.com/v1/models
openai            | ~/Desktop/media-server/.env | OPENAI_API_KEY | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bearer $SECRET" https://api.openai.com/v1/models
perplexity        | ~/Desktop/media-server/.env | PERPLEXITY_API_KEY | |
tmdb              | ~/Desktop/media-server/.env | TMDB_API_KEY | | curl -s -o /dev/null -w %{http_code} "https://api.themoviedb.org/3/configuration?api_key=$SECRET"
google-books      | ~/Desktop/media-server/.env | GOOGLE_BOOKS_API_KEY | | curl -s -o /dev/null -w %{http_code} "https://www.googleapis.com/books/v1/volumes?q=test&key=$SECRET"
discord-bot       | ~/Desktop/media-server/800801-discord-bot/.env | DISCORD_TOKEN | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bot $SECRET" https://discord.com/api/v10/users/@me
ms-discord-bot    | ~/Desktop/media-server/.env | DISCORD_BOT_TOKEN | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bot $SECRET" https://discord.com/api/v10/users/@me
admin-webhook     | ~/Desktop/media-server/.env | ADMIN_WEBHOOK_URL | | curl -s -o /dev/null -w %{http_code} "$SECRET"
discord-webhook   | ~/Desktop/media-server/.env | DISCORD_WEBHOOK | | curl -s -o /dev/null -w %{http_code} "$SECRET"
obsidian-notify   | ~/.config/obsidian-notify.env | DISCORD_WEBHOOK_URL | | curl -s -o /dev/null -w %{http_code} "$SECRET"
twilio-auth       | ~/Desktop/media-server/.env | TWILIO_AUTH_TOKEN | |
plex-claim        | ~/Desktop/media-server/.env | PLEX_CLAIM_TOKEN | |
prwatcher-github  | ~/Desktop/media-server/.env | PRWATCHER_GITHUB_TOKEN | | curl -s -o /dev/null -w %{http_code} -H "Authorization: Bearer $SECRET" https://api.github.com/user
wud-lscr          | ~/Desktop/media-server/.env | WUD_LSCR_TOKEN | |
notifiarr         | ~/Desktop/media-server/.env | NOTIFIARR_API_KEY | |
oauth2-client     | ~/Desktop/media-server/.env | OAUTH2_CLIENT_SECRET | |
annas-archive     | ~/Desktop/media-server/missing-readarr/.env | ANNAS_ARCHIVE_SECRET | |
tailscale-oauth   | ~/.config/tailscale-monitor/credentials.env | TS_OAUTH_CLIENT_SECRET | |
zendesk           | ~/obsidian-vault/01_Projects/zendesk-economik/.env | ZENDESK_API_TOKEN | |
reddit-client-id     | ~/.config/reddit-fetch.env | REDDIT_CLIENT_ID | |
reddit-client-secret | ~/.config/reddit-fetch.env | REDDIT_CLIENT_SECRET | |
reddit-username      | ~/.config/reddit-fetch.env | REDDIT_USERNAME | |
reddit-password      | ~/.config/reddit-fetch.env | REDDIT_PASSWORD | |
